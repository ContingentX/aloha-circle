AWSTemplateFormatVersion: "2010-09-09"
Description: AlohaLive static site - S3 + CloudFront + ACM + Route53 (per environment)

Parameters:
  ProjectName:
    Type: String
    Default: alohalive
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  DomainName:
    Type: String
    Description: Primary FQDN for this environment (e.g. dev.alohalive.net or alohalive.net).
  HostedZoneId:
    Type: String
    Default: Z07263701EFGE2972ASGC
  CreateWww:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Also serve www.<DomainName> and redirect it to the apex (prod).
  AltDomainName:
    Type: String
    Default: ""
    Description: Optional secondary apex served by the same distribution (e.g. aloha-circle.com). Empty disables it.
  AltHostedZoneId:
    Type: String
    Default: ""
    Description: Hosted zone id for AltDomainName. Required when AltDomainName is set.
  CanonicalDomain:
    Type: String
    Default: ""
    Description: >-
      When set, the viewer-request function 301-redirects every other host on
      the distribution (www variants and the legacy apex alike) to this domain.
      Lets a stack keep its original DomainName/AltDomainName parameters — and
      therefore its existing cert and Route53 records — while the site's
      canonical identity moves to the other apex. Empty keeps the plain
      www-to-apex behaviour. Requires CreateWww (the function only exists there).

# The alt-domain parameters only work as a pair: the cert validation and the
# Alt* Route53 records both need the zone id. Reject a half-specified pair at
# changeset time with a descriptive error instead of failing mid-deploy.
Rules:
  AltDomainRequiresZone:
    RuleCondition: !Not [!Equals [!Ref AltDomainName, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref AltHostedZoneId, ""]]
        AssertDescription: AltHostedZoneId is required when AltDomainName is set.
  AltZoneRequiresDomain:
    RuleCondition: !Not [!Equals [!Ref AltHostedZoneId, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref AltDomainName, ""]]
        AssertDescription: AltDomainName is required when AltHostedZoneId is set.

Conditions:
  WithWww: !Equals [!Ref CreateWww, "true"]
  WithAlt: !Not [!Equals [!Ref AltDomainName, ""]]
  WithAltWww: !And [!Condition WithAlt, !Condition WithWww]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-site-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # ACM cert must live in us-east-1 for CloudFront. DomainValidationOptions with a
  # HostedZoneId makes CloudFormation create the DNS validation records automatically.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        !If
          - WithAltWww
          - [!Sub "www.${DomainName}", !Ref AltDomainName, !Sub "www.${AltDomainName}"]
          - !If
              - WithAlt
              - [!Ref AltDomainName]
              - !If [WithWww, [!Sub "www.${DomainName}"], !Ref "AWS::NoValue"]
      ValidationMethod: DNS
      DomainValidationOptions:
        !If
          - WithAltWww
          - - DomainName: !Ref DomainName
              HostedZoneId: !Ref HostedZoneId
            - DomainName: !Sub "www.${DomainName}"
              HostedZoneId: !Ref HostedZoneId
            - DomainName: !Ref AltDomainName
              HostedZoneId: !Ref AltHostedZoneId
            - DomainName: !Sub "www.${AltDomainName}"
              HostedZoneId: !Ref AltHostedZoneId
          - !If
              - WithAlt
              - - DomainName: !Ref DomainName
                  HostedZoneId: !Ref HostedZoneId
                - DomainName: !Ref AltDomainName
                  HostedZoneId: !Ref AltHostedZoneId
              - !If
                  - WithWww
                  - - DomainName: !Ref DomainName
                      HostedZoneId: !Ref HostedZoneId
                    - DomainName: !Sub "www.${DomainName}"
                      HostedZoneId: !Ref HostedZoneId
                  - - DomainName: !Ref DomainName
                      HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${Environment}-s3-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Host canonicalisation (301), prod only. Without CanonicalDomain: redirect
  # www.<host> to its own apex, for every domain on the distribution. With
  # CanonicalDomain: redirect EVERY other host (www variants and the legacy
  # apex alike) to the canonical domain — how aloha-circle.com became the one
  # true home while the stack keeps serving/redirecting alohalive.net.
  WwwToApexFunction:
    Type: AWS::CloudFront::Function
    Condition: WithWww
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-www-to-apex"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www + legacy hosts to the canonical apex (301)
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value;
          var canonical = '${CanonicalDomain}';
          var target = null;
          if (canonical && host !== canonical) target = canonical;
          else if (!canonical && host.indexOf('www.') === 0) target = host.slice(4);
          if (target) {
            var qs = Object.keys(request.querystring).map(function (k) {
              return k + '=' + request.querystring[k].value;
            }).join('&');
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://' + target + request.uri + (qs ? '?' + qs : '') },
              },
            };
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "AlohaLive (${Environment})"
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases:
          !If
            - WithAltWww
            - [!Ref DomainName, !Sub "www.${DomainName}", !Ref AltDomainName, !Sub "www.${AltDomainName}"]
            - !If
                - WithAlt
                - [!Ref DomainName, !Ref AltDomainName]
                - !If
                    - WithWww
                    - [!Ref DomainName, !Sub "www.${DomainName}"]
                    - [!Ref DomainName]
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            !If
              - WithWww
              - - EventType: viewer-request
                  FunctionARN: !GetAtt WwwToApexFunction.FunctionMetadata.FunctionARN
              - !Ref "AWS::NoValue"
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ApexRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # fixed CloudFront alias zone id
        EvaluateTargetHealth: false

  ApexRecordV6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: WithWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwRecordV6:
    Type: AWS::Route53::RecordSet
    Condition: WithWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AltApexRecord:
    Type: AWS::Route53::RecordSet
    Condition: WithAlt
    Properties:
      HostedZoneId: !Ref AltHostedZoneId
      Name: !Ref AltDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AltApexRecordV6:
    Type: AWS::Route53::RecordSet
    Condition: WithAlt
    Properties:
      HostedZoneId: !Ref AltHostedZoneId
      Name: !Ref AltDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AltWwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: WithAltWww
    Properties:
      HostedZoneId: !Ref AltHostedZoneId
      Name: !Sub "www.${AltDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AltWwwRecordV6:
    Type: AWS::Route53::RecordSet
    Condition: WithAltWww
    Properties:
      HostedZoneId: !Ref AltHostedZoneId
      Name: !Sub "www.${AltDomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !Sub "https://${DomainName}"
