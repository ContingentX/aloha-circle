name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  # Dev and production currently share one Lambda, table, API, and stack.
  group: alohalive-shared-backend-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Both sites currently share one production API/table, so backend changes
    # must pass the same human approval gate as the production workflow.
    environment: production
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test public API contract
        run: node --test infra/donations/*.test.mjs
      - name: Check deploy scripts and Lambda syntax
        run: |
          bash -n infra/deploy.sh infra/deploy-web.sh infra/package-donations.sh infra/seed-demo-data.sh
          node --check infra/donations/index.mjs
          node --check infra/donations/public-api.mjs
          SEED_DRY_RUN=1 ./infra/seed-demo-data.sh
          package_dir="$(mktemp -d)"
          ./infra/package-donations.sh "$package_dir/donations.zip"
          rm -rf "$package_dir"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy infrastructure (dev)
        run: ./infra/deploy.sh dev
      - name: Publish web build (dev)
        run: ./infra/deploy-web.sh dev
