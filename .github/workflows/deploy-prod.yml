name: Deploy prod

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  # Dev and production currently share one backend Lambda/table.
  group: alohalive-shared-backend-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      VITE_API_BASE: ${{ vars.VITE_API_BASE_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test production agent API contract
        run: |
          node --test infra/donations/agent-api.test.mjs
          node --check infra/donations/agent-api.mjs
          node --check infra/donations/index.mjs
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy infrastructure (prod)
        run: ./infra/deploy.sh prod
      - name: Publish web build (prod)
        run: ./infra/deploy-web.sh prod
